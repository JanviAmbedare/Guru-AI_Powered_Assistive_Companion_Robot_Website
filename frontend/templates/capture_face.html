<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GURU Face Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:Segoe UI;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{

    width:100%;
    max-width:900px;

    background:#111827;
    border-radius:24px;

    padding:40px;

    box-shadow:
        0 0 30px rgba(0,0,0,0.4);

    border:1px solid rgba(255,255,255,0.05);
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    font-size:34px;
    color:#38bdf8;
}

.header p{
    color:#94a3b8;
    margin-top:10px;
}

.video-container{

    position:relative;

    display:flex;
    justify-content:center;

    margin-bottom:30px;
}

video{

    width:100%;
    max-width:650px;

    border-radius:20px;

    border:4px solid #2563eb;

    background:black;
}

.face-guide{

    position:absolute;

    width:260px;
    height:320px;

    border:3px dashed #38bdf8;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:translate(-50%, -50%);
}

.stats{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;

    margin-bottom:30px;
}

.card{

    background:#1e293b;

    padding:20px;

    border-radius:18px;

    text-align:center;
}

.card h2{
    font-size:28px;
    color:#38bdf8;
}

.progress-bar{

    width:100%;
    height:18px;

    background:#1e293b;

    border-radius:20px;

    overflow:hidden;

    margin-top:20px;
}

.progress{

    width:0%;
    height:100%;

    background:#2563eb;

    transition:0.3s;
}

.buttons{

    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

button{

    border:none;

    padding:16px 28px;

    border-radius:14px;

    font-size:16px;

    cursor:pointer;

    transition:0.3s;
}

.start-btn{
    background:#2563eb;
    color:white;
}

.stop-btn{
    background:#dc2626;
    color:white;
}

button:hover{
    transform:scale(1.04);
}

.status{

    text-align:center;

    margin-top:25px;

    color:#94a3b8;

    font-size:18px;
}

.success{
    color:#22c55e;
}

.error{
    color:#ef4444;
}

.loader{

    display:none;

    margin:20px auto;

    border:5px solid #1e293b;
    border-top:5px solid #38bdf8;

    border-radius:50%;

    width:50px;
    height:50px;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>📸 GURU Face Registration</h1>

        <p>
            Capture 60 facial samples
            for secure biometric authentication
        </p>

    </div>

    <!-- VIDEO -->
    <div class="video-container">

        <video id="video" autoplay muted></video>

        <div class="face-guide"></div>

    </div>

    <!-- STATS -->
    <div class="stats">

        <div class="card">
            <p>Captured</p>
            <h2 id="sampleCount">0</h2>
        </div>

        <div class="card">
            <p>Target</p>
            <h2>60</h2>
        </div>

        <div class="card">
            <p>Status</p>
            <h2 id="statusText">Ready</h2>
        </div>

    </div>

    <!-- PROGRESS -->
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>

    <!-- LOADER -->
    <div class="loader" id="loader"></div>

    <!-- BUTTONS -->
    <div class="buttons">

        <button
            class="start-btn"
            onclick="startCapture()"
        >
            ▶ Start Capture
        </button>

        <button
            class="stop-btn"
            onclick="stopCapture()"
        >
            ⏹ Stop
        </button>

    </div>

    <!-- STATUS -->
    <div class="status" id="message">

        Waiting to start...

    </div>

</div>

<script>

const USER_ID = "{{ user_id }}";

console.log(USER_ID);

</script>

<script src="/static/js/capture_face.js"></script>

</body>
</html>
