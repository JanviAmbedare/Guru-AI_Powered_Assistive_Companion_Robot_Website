<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GURU Voice Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#0f172a;

    color:white;

    font-family:Segoe UI;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    padding:20px;
}

.container{

    width:100%;
    max-width:750px;

    background:#111827;

    border-radius:24px;

    padding:40px;

    text-align:center;

    box-shadow:
        0 0 30px rgba(0,0,0,0.4);

    border:1px solid rgba(255,255,255,0.05);
}

h1{

    font-size:34px;

    color:#38bdf8;

    margin-bottom:15px;
}

.subtitle{
    color:#94a3b8;
    margin-bottom:35px;
}

.mic{

    width:180px;
    height:180px;

    border-radius:50%;

    background:#1e293b;

    margin:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:70px;

    border:4px solid #2563eb;

    transition:0.3s;
}

.mic.recording{

    background:#dc2626;

    transform:scale(1.05);
}

.counter{

    margin-top:30px;
    font-size:26px;
}

.progress-bar{

    width:100%;
    height:18px;

    background:#1e293b;

    border-radius:20px;

    overflow:hidden;

    margin-top:25px;
}

.progress{

    width:0%;
    height:100%;

    background:#2563eb;

    transition:0.3s;
}

button{

    margin-top:35px;

    border:none;

    background:#2563eb;

    color:white;

    padding:16px 32px;

    border-radius:14px;

    font-size:18px;

    cursor:pointer;

    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

.status{

    margin-top:25px;

    color:#94a3b8;

    font-size:18px;
}

.success{
    color:#22c55e;
}

.error{
    color:#ef4444;
}

</style>

</head>

<body>

<div class="container">

    <h1>🎤 GURU Voice Registration</h1>

    <p class="subtitle">
        Record 15 voice samples
        for voice authentication
    </p>

    <div class="mic" id="mic">

        🎙️

    </div>

    <div class="counter">

        Sample
        <span id="count">0</span>
        / 15

    </div>

    <div class="progress-bar">

        <div class="progress" id="progress"></div>

    </div>

    <button onclick="recordSample()">

        🎤 Record Sample

    </button>

    <div class="status" id="status">

        Ready to record

    </div>

</div>

<script>

const USER_ID = "{{ user_id }}";

console.log(USER_ID);

</script>
<!-- CONFIG -->
<script src="{{ url_for('static', filename='js/config.js') }}"></script>

<!-- API ENGINE -->
<script src="{{ url_for('static', filename='js/api.js') }}"></script>

<script src="/static/js/capture_voice.js"></script>

</body>
</html>
