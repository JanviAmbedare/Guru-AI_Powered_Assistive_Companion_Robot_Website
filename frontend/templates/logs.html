<!DOCTYPE html>
<html>
<head>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Segoe UI;
    padding:40px;
}

h1{
    color:#38bdf8;
    margin-bottom:25px;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th,

    border-bottom:1px solid #1e293b;

}

}

}

</head>

<div class="topbar">

    <h1>

</div>

    <th>User</th>

</tbody>
