<!DOCTYPE html>
<html>
<head>
<title>GURU Registration</title>

<style>

body{
    background:#020617;
    color:white;
    font-family:Segoe UI;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    color:#38bdf8;
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#111827;
    padding:25px;
    border-radius:22px;
}

.status{
    margin-top:15px;
    color:#22c55e;
}

.btn{
    display:inline-block;
    margin-top:18px;
    background:#2563eb;
    padding:12px 18px;
    border-radius:12px;
    text-decoration:none;
    color:white;
}

</style>
</head>
<body>

<div class="container">

<h1>🧠 AI Biometric Registration</h1>

<div class="grid">

<div class="card">

    <h2>📸 Face Registration</h2>

    <p>
        Capture 60 facial samples
    </p>

    <div class="status">
        ✔ Ready
    </div>

    <a class="btn" href="/capture-face/{{ session.user_id }}">
        Start Face Capture
    </a>

</div>

<div class="card">

    <h2>🎤 Voice Registration</h2>

    <p>
        Record 15 voice samples
    </p>

    <div class="status">
        ✔ Ready
    </div>

    <a class="btn" href="/capture-voice/{{ session.user_id }}">
        Start Voice Capture
    </a>

</div>

<div class="card">

    <h2>🤖 AI Training</h2>

    <p>
        Generate embeddings & models
    </p>

    <div class="status">
        ⏳ Pending
    </div>

</div>

</div>

</div>

</body>
</html>
