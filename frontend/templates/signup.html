<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GURU AI Signup</title>

<style>

body{
    background:#020617;
    color:white;
    font-family:Segoe UI;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:500px;
    background:#111827;
    padding:40px;
    border-radius:28px;
    border:1px solid rgba(255,255,255,0.06);
}

h1{
    color:#38bdf8;
    margin-bottom:10px;
}

p{
    color:#94a3b8;
    margin-bottom:30px;
}

input,select{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.stepper{
    display:flex;
    justify-content:space-between;
    margin-bottom:30px;
}

.step{
    background:#1e293b;
    padding:10px 15px;
    border-radius:12px;
    font-size:14px;
}

.active{
    background:#2563eb;
}
.error-box{
    display:none;
    background:#dc2626;
    color:white;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
    font-weight:600;
}
</style>
</head>
<body>

<div class="card">

    <h1>Create GURU Account</h1>

    <p>
        Start your AI companion onboarding
    </p>
    
    <div class="stepper">
        <div class="step active">Account</div>
        <div class="step">Face</div>
        <div class="step">Voice</div>
        <div class="step">Complete</div>
    </div>
    <div id="signupError" class="error-box"></div>
    <form method="POST">

        <input type="text" name="name" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <select name="role">
            <option value="USER">USER</option>
            <option value="OWNER">OWNER</option>
        </select>

        <select name="disability_type">
            <option value="">No Disability</option>
            <option value="VISION">Vision</option>
            <option value="HEARING">Hearing</option>
            <option value="MOBILITY">Mobility</option>
        </select>

        <select name="language_pref">
            <option>English</option>
            <option>Hindi</option>
            <option>Marathi</option>
        </select>

        <button type="submit">
            Continue to Biometric Setup
        </button>

    </form>

</div>

</body>
</html>
