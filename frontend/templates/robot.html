<!DOCTYPE html>
<html>
<head>
<title>GURU Robot Control</title>

<style>

body{
    background:#020617;
    color:white;
    font-family:Segoe UI;
    padding:40px;
}

h1{
    color:#38bdf8;
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.card{
    background:#111827;
    padding:30px;
    border-radius:24px;
}

.status{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.status-box{
    background:#1e293b;
    padding:20px;
    border-radius:18px;
}

.controls{
    display:grid;
    grid-template-columns:repeat(3,100px);
    gap:15px;
    justify-content:center;
    margin-top:20px;
}

button{
    padding:18px;
    border:none;
    border-radius:16px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

.emergency{
    background:#ef4444;
}
.emergency-btn{

    background:#dc2626;
    color:white;

    border:none;

    padding:12px 20px;

    border-radius:12px;

    cursor:pointer;

    font-weight:bold;

    transition:0.3s;
}

.emergency-btn:hover{

    background:#b91c1c;

    transform:scale(1.05);
}
</style>
</head>
<body>

<h1>🤖 Robot Operating Console</h1>
<div style="text-align:right;margin-bottom:20px;">

    <button
        id="emergencyBtn"
        class="emergency-btn"
    >
        🚨 Emergency Stop
    </button>

</div>
<div class="grid">

<div class="card">

    <h2>Robot Telemetry</h2>

    <div class="status">

        <div class="status-box">
    🔋 Battery:
    <span id="batteryLevel">
        Loading...
    </span>
</div>

        <div class="status-box">
    🌡 CPU:
    <span id="cpuTemp">
        Loading...
    </span>
</div>

        <div class="status-box">
    🎤 Microphone:
    <span id="micStatus">
        Loading...
    </span>
</div>
        <div class="status-box">
    📷 Camera:
    <span id="cameraStatus">
        Loading...
    </span>
</div>
<div class="status-box">
    📍 Location:
    <span id="robotLocation">
        Unknown
    </span>
</div>

<div class="status-box">
    🚧 Obstacle:
    <span id="obstacleStatus">
        Unknown
    </span>
</div>

    </div>

</div>

<div class="card">

    <h2>Movement Controls</h2>

    <div class="controls">

        <div></div>

        <button id="forwardBtn">
    ⬆
</button>

        <div></div>

       <button id="leftBtn">⬅</button>

        <button
    class="emergency"
    id="stopBtn"
>
    🛑
</button>

        <button id="rightBtn">➡</button>

        <div></div>

       <button id="backwardBtn">⬇</button>

        <div></div>

    </div>

</div>

</div>
<script src="/static/js/alerts.js"></script>
<script>
const emergencyBtn =
    document.getElementById(
        "emergencyBtn"
    );

if(emergencyBtn){

    emergencyBtn.addEventListener(
        "click",
        () => {

            sendEmergencyAlert();

        }
    );
}
</script>

</body>
<!-- CONFIG -->
<script src="{{ url_for('static', filename='js/config.js') }}"></script>

<!-- API ENGINE -->
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script>
const USER_ID = {{ session.user_id }};

</script>
<script src="/static/js/notifications.js"></script>
<script src="/static/js/robot.js"></script>

</html>
