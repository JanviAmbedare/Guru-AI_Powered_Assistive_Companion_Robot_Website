<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GURU AI Chat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b1120;
    color:white;
    font-family:Segoe UI;
    display:flex;
    height:100vh;
    overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:280px;
    background:#111827;
    border-right:1px solid #1f2937;
    padding:20px;
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:28px;
    font-weight:bold;
    margin-bottom:30px;
    color:#38bdf8;
}

.new-chat{
    background:#2563eb;
    border:none;
    padding:14px;
    border-radius:12px;
    color:white;
    cursor:pointer;
    margin-bottom:25px;
    font-size:16px;
}

.history{
    flex:1;
    overflow-y:auto;
}

.history-item{
    background:#1e293b;
    padding:12px;
    margin-bottom:12px;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

.history-item:hover{
    background:#334155;
}

.sidebar-footer{
    margin-top:20px;
}

.sidebar-footer a{
    color:#94a3b8;
    text-decoration:none;
}

/* =========================
   MAIN CHAT
========================= */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
    padding:20px;
    border-bottom:1px solid #1f2937;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    color:#38bdf8;
}

/* =========================
   CHAT AREA
========================= */

.chat-container{
    flex:1;
    overflow-y:auto;
    padding:30px;
}

.message{
    display:flex;
    margin-bottom:25px;
}

.user{
    justify-content:flex-end;
}

.bot{
    justify-content:flex-start;
}

.bubble{
    max-width:70%;
    padding:16px;
    border-radius:18px;
    line-height:1.6;
    font-size:15px;
}

.user .bubble{
    background:#2563eb;
}

.bot .bubble{
    background:#1e293b;
    border:1px solid rgba(255,255,255,0.06);
}

/* =========================
   INPUT AREA
========================= */

.input-area{
    border-top:1px solid #1f2937;
    padding:20px;
    background:#111827;
}

.input-form{
    display:flex;
    gap:15px;
}

.input-form input{
    flex:1;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#1e293b;
    color:white;
    font-size:15px;
}

.input-form input:focus{
    outline:none;
    border:1px solid #38bdf8;
}

.send-btn{
    background:#2563eb;
    border:none;
    padding:0 25px;
    border-radius:14px;
    color:white;
    cursor:pointer;
    font-size:16px;
}

/* =========================
   QUICK ACTIONS
========================= */

.quick-actions{
    display:flex;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.quick-btn{
    background:#1e293b;
    border:none;
    padding:10px 16px;
    border-radius:12px;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.quick-btn:hover{
    background:#334155;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:10px;
}

</style>
</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

    <div class="logo">🤖 GURU AI</div>

    <button class="new-chat">
        + New Chat
    </button>

    <div class="history">

        <div class="history-item">
            Health Assistance
        </div>

        <div class="history-item">
            Medication Reminder
        </div>

        <div class="history-item">
            Emergency Alert
        </div>

        <div class="history-item">
            Robot Navigation
        </div>

    </div>

    <div class="sidebar-footer">
        <a href="/">← Back to Dashboard</a>
    </div>

</div>

<!-- =========================
     MAIN
========================= -->

<div class="main">

    <!-- HEADER -->
    <div class="header">

        <div>
            <h2>GURU AI Assistant</h2>
            <p style="color:#94a3b8">
                Autonomous Assistive Companion
            </p>
        </div>

        <div style="color:#22c55e">
            ● Online
        </div>

    </div>

    <!-- CHAT -->
    <div class="chat-container" id="chatContainer">

        <!-- QUICK ACTIONS -->
        <div class="quick-actions">

            <button class="quick-btn"
                onclick="quickMessage('What reminders do I have?')">
                ⏰ Reminders
            </button>

            <button class="quick-btn"
                onclick="quickMessage('Check robot status')">
                🤖 Robot Status
            </button>

            <button class="quick-btn"
                onclick="quickMessage('Send emergency alert')">
                🚨 Emergency
            </button>

            <button class="quick-btn"
                onclick="quickMessage('How am I feeling today?')">
                😊 Emotion Check
            </button>

        </div>

        <!-- CHAT HISTORY -->
        {% for c in conversations %}

            <div class="message user">
                <div class="bubble">
                    {{ c.text }}
                </div>
            </div>

            <div class="message bot">
                <div class="bubble">
                    {{ c.response }}
                </div>
            </div>

        {% endfor %}

    </div>

    <!-- INPUT -->
    <div class="input-area">

        <form method="POST" class="input-form">

            <input
                type="text"
                id="messageInput"
                name="message"
                placeholder="Message GURU AI..."
                autocomplete="off"
                required
            >

            <button class="send-btn">
                Send
            </button>

        </form>

    </div>

</div>

<script>

function quickMessage(text){
    document.getElementById("messageInput").value = text;
}

const chatContainer = document.getElementById("chatContainer");

chatContainer.scrollTop = chatContainer.scrollHeight;

</script>
<script>

const socket = new WebSocket(
    "ws://localhost:8000/ws/chat/1"
);

socket.onmessage = (event) => {

    const data = JSON.parse(event.data);

    appendBotMessage(
        data.response
    );
};

function sendMessage(){

    const input = document.getElementById(
        "messageInput"
    );

    socket.send(input.value);

    appendUserMessage(input.value);

    input.value = "";
}

</script>
<!-- CONFIG -->
<script src="{{ url_for('static', filename='js/config.js') }}"></script>

<!-- API ENGINE -->
<script src="{{ url_for('static', filename='js/api.js') }}"></script>

<script src="/static/js/notifications.js"></script>

<script src="/static/js/alerts.js"></script>
</body>
</html>
