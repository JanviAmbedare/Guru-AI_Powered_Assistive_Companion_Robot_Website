<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GURU AI Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,#020617,#0f172a,#111827);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Segoe UI;
    color:white;
}

.card{
    width:420px;
    background:rgba(17,24,39,0.85);
    backdrop-filter:blur(16px);
    padding:40px;
    border-radius:28px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 40px rgba(0,0,0,0.5);
}

.logo{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    color:#38bdf8;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:35px;
}

.input-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#cbd5e1;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#1e293b;
    color:white;
    font-size:15px;
}

input:focus{
    outline:none;
    border:1px solid #38bdf8;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.links{
    margin-top:20px;
    text-align:center;
}

.links a{
    color:#38bdf8;
    text-decoration:none;
}

.remember{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

</style>
</head>
<body>

<div class="card">

    <div class="logo">🤖 GURU AI</div>

    <div class="subtitle">
        Autonomous Assistive Companion
    </div>

    <form method="POST">

        <div class="input-group">
            <label>Username</label>
            <input type="text" name="name" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <div class="remember">
            <input type="checkbox" name="remember">
            <span>Remember Me</span>
        </div>

        <button class="btn" type="submit">
            Login
        </button>

    </form>

    <div class="links">
        <p>
            Don't have an account?
            <a href="/signup">Create Account</a>
        </p>
    </div>

</div>
<!-- CONFIG -->
<script src="{{ url_for('static', filename='js/config.js') }}"></script>

<!-- API ENGINE -->
<script src="{{ url_for('static', filename='js/api.js') }}"></script>

</body>
</html>
