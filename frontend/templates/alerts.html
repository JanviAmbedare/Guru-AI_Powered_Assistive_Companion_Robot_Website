<!DOCTYPE html>
<html>

<head>

<title>GURU Alerts</title>

<link rel="stylesheet"
href="/static/css/alerts.css">

</head>

<body>

<div class="container">

    <div class="topbar">

        <h1>
            🚨 Alert Dashboard
        </h1>

        <button id="emergencyBtn">
            Trigger Emergency
        </button>

    </div>

    <div class="stats">

        <div class="stat">
            <h2>
                {{ analytics.total_alerts }}
            </h2>
            <p>Total Alerts</p>
        </div>

        <div class="stat critical">
            <h2>
                {{ analytics.critical_alerts }}
            </h2>
            <p>Critical</p>
        </div>

        <div class="stat active">
            <h2>
                {{ analytics.active_alerts }}
            </h2>
            <p>Active</p>
        </div>

    </div>
    <div
        id="alertsContainer"
        class="alerts-grid">

    </div>
    
</div>


<!-- EMERGENCY MODAL -->

<div id="modal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>🚨 Emergency Alert</h2>

            <button
                class="close-btn"
                id="closeModalBtn">

                ✕

            </button>

        </div>


        <div class="form-group">

            <label>Emergency Message</label>

            <textarea
                id="emergencyMessage"
                placeholder="Describe the emergency..."
            ></textarea>

        </div>


        <button
            class="danger-btn"
            id="sendEmergencyBtn">

            Trigger Emergency

        </button>

    </div>

</div>

<script src="/static/js/alerts.js"></script>
<script>

const USER_ID = {{ user_id }};

const emergencyBtn =
    document.getElementById(
        "emergencyBtn"
    );

if(emergencyBtn){

    emergencyBtn.addEventListener(
        "click",
        () => {

            sendEmergencyAlert();

        }
    );
}
</script>

<script src="{{ url_for('static', filename='js/config.js') }}"></script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="/static/js/notifications.js"></script>



</body>
</html>
